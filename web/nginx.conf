# Serves the built React app and routes API calls to the two services (same paths as the Vite dev proxy).
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/content/ { proxy_pass http://content:5001/; }
  location /api/practice/ { proxy_pass http://practice:8000/; }
  location / { try_files $uri /index.html; }
}
